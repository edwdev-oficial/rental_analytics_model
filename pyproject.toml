[tool.poetry]
name = "rental-analytics-model"
version = "0.1.0"
description = "Rental equipment analytics and simulation model"
authors = ["Eduardo Oliveira"]
readme = "README.md"
packages = [{ include = "rental_analytics_model", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
streamlit = "^1.55.0"
pandas = "^2.2.3"
numpy = "^2.1.0"
plotly = "^5.24.1"
openpyxl = "^3.1.5"
xlsxwriter = "^3.2.0"
python-dateutil = "^2.9.0"
pdfplumber = "^0.11.9"
streamlit-pdf = "^2.0.1"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
black = "^24.8.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
